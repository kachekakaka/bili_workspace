name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.lock
          python -m pip check
      - name: Verify source tree
        run: python tools/verify_source.py
      - name: Compile Python
        run: python -m compileall -q app tests tools docker
      - name: Ruff
        run: python -m ruff check --no-cache app tests tools docker

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript and module syntax
        shell: bash
        run: find web -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z | xargs -0 -n1 node --check
      - name: Run dependency-free frontend module tests
        run: node --test tests/frontend/*.test.mjs

  focused-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check documentation skeleton
        run: python -B -X utf8 SoftwareTesting/doc_consistency/test_doc_consistency.py --workspace-root .

  playwright:
    name: T-PROJECT browser phase
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.lock
          python -m pip check
      - name: Run the T-PROJECT Playwright phase
        env:
          BILI_TEST_ROOT: ${{ runner.temp }}/bili_workspace_test
          PYTHON: python
        run: sh scripts/dev/run-playwright-phase.sh
      - name: Upload isolated Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t-project-playwright-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bili_workspace_test/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  product-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.lock
          python -m pip check
      - name: Run the complete non-browser Python behavior suite
        run: python -m pytest -q -p no:cacheprovider --tb=short -m "not integration and not playwright"

  windows-validation:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'main'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install unified development and launcher dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.lock -r launcher/requirements-dev.txt
          python -m pip check
      - name: Run Windows launcher tests
        run: python -B -X utf8 -m pytest -q launcher/tests

  docker-validation:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build validation image
        run: docker build -f docker/Dockerfile --build-arg TARGETARCH=amd64 -t bili-workspace:validation .
      - name: Smoke application version inside image
        run: >-
          docker run --rm --entrypoint python bili-workspace:validation
          -c "from app import __version__; assert __version__ == '0.7.0'; print(__version__)"

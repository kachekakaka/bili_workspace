name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.lock
          python -m pip check
      - name: Verify source tree
        run: python tools/verify_source.py
      - name: Compile Python
        run: python -m compileall -q app tests tools docker
      - name: Ruff
        run: python -m ruff check --no-cache app tests tools docker
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider --tb=short 2>&1 | tee pytest-3.11.log
      - name: Upload failed pytest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-3.11-${{ github.run_attempt }}
          path: pytest-3.11.log
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript and module syntax
        shell: bash
        run: find web -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z | xargs -0 -n1 node --check
      - name: Run dependency-free frontend module tests
        run: node --test tests/frontend/*.test.mjs

  focused-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.lock
          python -m pip check
      - name: Check documentation skeleton
        run: python -B -X utf8 SoftwareTesting/doc_consistency/test_doc_consistency.py --workspace-root .
      - name: Test SQLite, userdata and frontend architecture contracts
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_userdata.py
          tests/test_v05_persistence.py
          tests/test_index_store.py
          tests/test_v060_migrations.py
          tests/test_v060_task_ownership.py
          tests/test_v061_userless_migration.py
          tests/test_v060_release.py
          tests/test_v070_release.py
          tests/test_v062_ui.py
          tests/test_v062_settings_ui.py
          tests/test_v070_frontend_architecture.py
      - name: Check Windows call chain and Docker configuration
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_v05_docker.py
          tests/test_repository_layout.py
          tests/test_t_project_isolation.py

  playwright:
    name: T-PROJECT browser phase
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.lock
          python -m pip check
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Resolve installed Playwright headless shell
        shell: bash
        run: |
          set -eu
          browser="$(
            python - <<'PY'
          from pathlib import Path

          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              chromium = Path(playwright.chromium.executable_path)

          browser_dir = chromium.parent.parent
          prefix = "chromium-"
          if not browser_dir.name.startswith(prefix):
              raise SystemExit(f"unexpected Playwright Chromium path: {chromium}")
          revision = browser_dir.name.removeprefix(prefix)
          headless_shell = (
              browser_dir.parent
              / f"chromium_headless_shell-{revision}"
              / "chrome-headless-shell-linux64"
              / "chrome-headless-shell"
          )
          print(headless_shell)
          PY
          )"
          test -x "$browser"
          printf 'BILI_PLAYWRIGHT_CHROMIUM=%s\n' "$browser" >> "$GITHUB_ENV"
      - name: Run the T-PROJECT Playwright phase
        env:
          BILI_TEST_ROOT: ${{ runner.temp }}/bili_workspace_test
          PYTHON: python
        run: sh scripts/dev/run-playwright-phase.sh
      - name: Upload isolated Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t-project-playwright-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bili_workspace_test/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  product-validation:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'main' ||
      github.head_ref == 'release/v0.7.0' ||
      github.head_ref == 'agent/v060-release-validation' ||
      github.head_ref == 'agent/v060-userless-db-migration' ||
      github.head_ref == 'feature/ui-v0.6.2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.lock
          python -m pip check
      - name: Validate V0.7.0 accounts, ownership, migrations, search and frontend architecture
        run: >-
          python -m pytest -q -p no:cacheprovider --tb=short
          tests/test_v060_accounts.py
          tests/test_v060_auth_sessions.py
          tests/test_v060_auth_races.py
          tests/test_v060_task_ownership.py
          tests/test_v060_migrations.py
          tests/test_v061_userless_migration.py
          tests/test_search_v060.py
          tests/test_v060_release.py
          tests/test_v070_release.py
          tests/test_v062_ui.py
          tests/test_v062_settings_ui.py
          tests/test_v070_frontend_architecture.py

  windows-validation:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'main' ||
      github.head_ref == 'release/v0.7.0' ||
      github.head_ref == 'agent/v060-release-validation' ||
      github.head_ref == 'agent/v060-userless-db-migration' ||
      github.head_ref == 'feature/ui-v0.6.2'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements/dev.lock
            launcher/requirements.txt
            launcher/requirements-dev.txt
      - name: Install unified development and launcher dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.lock -r launcher/requirements-dev.txt
          python -m pip check
      - name: Verify source tree with Python 3.11
        run: python -B -X utf8 tools/verify_source.py
      - name: Run Windows launcher tests
        run: python -B -X utf8 -m pytest -q launcher/tests

  docker-validation:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'main' ||
      github.head_ref == 'release/v0.7.0' ||
      github.head_ref == 'agent/v060-release-validation' ||
      github.head_ref == 'agent/v060-userless-db-migration' ||
      github.head_ref == 'feature/ui-v0.6.2'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.lock
          python -m pip check
      - name: Validate Docker persistence and old database upgrade
        run: >-
          python -m pytest -q -p no:cacheprovider --tb=short
          tests/test_v05_docker.py
          tests/test_v060_migrations.py
          tests/test_v060_task_ownership.py::test_v3_to_v4_migration_assigns_admin_without_revoking_sessions
          tests/test_v061_userless_migration.py
          tests/test_v060_release.py
          tests/test_v070_release.py
      - name: Build validation image
        run: docker build -f docker/Dockerfile --build-arg TARGETARCH=amd64 -t bili-workspace:validation .
      - name: Smoke application version inside image
        run: >-
          docker run --rm --entrypoint python bili-workspace:validation
          -c "from app import __version__; assert __version__ == '0.7.0'; print(__version__)"

name: Build integrated Windows runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - requirements/dev.lock
      - tools/build_integrated_runtime.py
      - scripts/windows/bootstrap-portable.ps1
      - scripts/windows/bootstrap-runtime.bat
      - scripts/windows/new-test-run.ps1
      - tools/t_project_isolation.py
      - tools/playwright_runtime.py
      - tools/config_sync.py
      - start.bat
      - verify.bat
      - LICENSES/**
      - .github/workflows/build-integrated-runtime.yml

permissions:
  contents: read

concurrency:
  group: integrated-windows-runtime
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up builder Python 3.13.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: requirements/dev.lock

      - name: Build repository runtime packs
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python tools/build_integrated_runtime.py --output vendor/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem vendor/windows/*-runtime.pack | Format-Table Name,Length

      - name: Validate generated runtime packs
        shell: pwsh
        run: |
          $env:BILI_VERIFY_NO_PAUSE = "1"
          $env:BILI_VERIFY_REQUIRE_NODE = "1"
          $env:BILI_VERIFY_REQUIRE_PLAYWRIGHT = "1"
          $env:BILI_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'bili_workspace_test'
          cmd /c verify.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload isolated validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bili-workspace-windows-validation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bili_workspace_test/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Upload a recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: bili-workspace-windows-runtime-${{ github.sha }}
          path: |
            vendor/windows/python-runtime.pack
            vendor/windows/media-runtime.pack
            vendor/windows/runtime-manifest.json
          if-no-files-found: error
          retention-days: 30

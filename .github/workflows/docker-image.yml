name: Validate multi-architecture Docker build
run-name: Validate Docker build for ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - app/**
      - web/**
      - config/**
      - docker/**
      - docker/Dockerfile
      - docker/compose.yaml
      - requirements/runtime.lock
      - .github/workflows/docker-image.yml

permissions:
  contents: read

concurrency:
  group: docker-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64/arm64 image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: bili-workspace:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max
